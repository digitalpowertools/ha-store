name: Build add-on images

# Builds the littleprinter add-on image for every HA-supported
# architecture and pushes version-tagged images to ghcr.io.
# Tag name convention (see config.yaml `image: ...-{arch}`):
#   ghcr.io/digitalpowertools/littleprinter-{amd64|aarch64|armv7}:<version>

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha_arch: amd64
            docker_arch: linux/amd64
          - ha_arch: aarch64
            docker_arch: linux/arm64
          - ha_arch: armv7
            docker_arch: linux/arm/v7
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: ver
        run: |
          version="$(sed -n 's/^version: "\(.*\)"/\1/p' littleprinter/config.yaml | tr -d '"')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Add-on version: $version"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: littleprinter
          platforms: ${{ matrix.docker_arch }}
          push: true
          tags: |
            ghcr.io/digitalpowertools/littleprinter-${{ matrix.ha_arch }}:${{ steps.ver.outputs.version }}
            ghcr.io/digitalpowertools/littleprinter-${{ matrix.ha_arch }}:latest
          cache-from: type=gha,scope=${{ matrix.ha_arch }}
          cache-to: type=gha,scope=${{ matrix.ha_arch }},mode=max
