<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Printer</title>
<style>
  :root { --ink: #1a1a1a; --paper: #fafafa; }
  * { box-sizing: border-box; }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: #e8e8e4; color: var(--ink);
    max-width: 420px; margin: 0 auto; padding: 24px 16px 48px;
  }
  h1 { font-size: 18px; letter-spacing: 2px; text-transform: uppercase;
       text-align: center; border-bottom: 3px dashed var(--ink); padding-bottom: 12px; }
  .card {
    background: var(--paper); border: 1px solid #ccc; border-radius: 6px;
    padding: 16px; margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; text-transform: uppercase;
          letter-spacing: 1px; margin-bottom: 6px; color: #555; }
  textarea { width: 100%; height: 120px; font: inherit; padding: 8px;
             border: 1px solid #bbb; border-radius: 4px; resize: vertical; }
  input[type=file] { font: inherit; width: 100%; }
  button {
    width: 100%; margin-top: 12px; padding: 12px; font: inherit;
    font-weight: bold; letter-spacing: 1px; text-transform: uppercase;
    background: var(--ink); color: var(--paper); border: 0; border-radius: 4px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: wait; }
  #status { text-align: center; font-size: 12px; min-height: 1.2em; margin-top: 12px; }
  #status.ok { color: #1a7a1a; }
  #status.err { color: #b00020; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button {
    margin: 0; padding: 6px 12px; width: auto; background: transparent;
    color: var(--ink); border: 1px solid #bbb; font-weight: normal;
  }
  .tabs button.active { background: var(--ink); color: var(--paper); }
  .panel { display: none; }
  .panel.active { display: block; }
  img.preview { max-width: 100%; max-height: 200px; display: block;
                margin: 8px auto 0; border: 1px dashed #bbb; padding: 4px; }
</style>
</head>
<body>
<h1>Little Printer</h1>

<div class="tabs">
  <button id="tab-text" class="active">Text</button>
  <button id="tab-image">Image</button>
</div>

<div class="card">
  <div id="panel-text" class="panel active">
    <label for="message">Message</label>
    <textarea id="message" placeholder="Hello, printer!"></textarea>
    <button id="print-text">Print</button>
  </div>
  <div id="panel-image" class="panel">
    <label for="image">Image (PNG / JPEG)</label>
    <input type="file" id="image" accept="image/png,image/jpeg">
    <img id="preview" class="preview" alt="" hidden>
    <button id="print-image" disabled>Print</button>
  </div>
</div>

<div id="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const status = (msg, cls) => {
  const el = $("status");
  el.textContent = msg;
  el.className = cls || "";
};

// Tabs
for (const id of ["text", "image"]) {
  $("tab-" + id).onclick = () => {
    $("tab-text").classList.toggle("active", id === "text");
    $("tab-image").classList.toggle("active", id === "image");
    $("panel-text").classList.toggle("active", id === "text");
    $("panel-image").classList.toggle("active", id === "image");
  };
}

// Image preview
let file = null;
$("image").onchange = () => {
  file = $("image").files[0] || null;
  $("print-image").disabled = !file;
  $("preview").hidden = !file;
  if (file) $("preview").src = URL.createObjectURL(file);
};

async function print(body, type, busyBtn) {
  busyBtn.disabled = true;
  status("Sending…");
  try {
    const res = await fetch("/print", { method: "POST", headers: { "Content-Type": type }, body });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    status(data.status === "queued" ? "Queued — printer is offline, will print on reconnect." : "Sent to printer!", "ok");
  } catch (err) {
    status("Failed: " + err.message, "err");
  } finally {
    busyBtn.disabled = false;
  }
}

$("print-text").onclick = () => {
  const text = $("message").value.trim();
  if (!text) { status("Type a message first.", "err"); return; }
  print(text, "text/plain", $("print-text"));
};

$("print-image").onclick = () => {
  if (!file) return;
  print(file, file.type, $("print-image"));
};

// Connection status
(async function poll() {
  try {
    const res = await fetch("/status");
    const st = await res.json();
    const dot = st.device_connected ? "🟢 printer connected" : (st.queued_print ? "🟡 printer offline — print queued" : "🔴 printer offline");
    document.title = dot.replace(/^\S+ /, "") + " — Little Printer";
  } catch { /* ignore */ }
  setTimeout(poll, 10000);
})();
</script>
</body>
</html>
