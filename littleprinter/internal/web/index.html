<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Printer</title>
<style>
  :root { --ink: #1a1a1a; --paper: #fafafa; }
  * { box-sizing: border-box; }
  body {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background: #e8e8e4; color: var(--ink);
    max-width: 420px; margin: 0 auto; padding: 24px 16px 48px;
  }
  h1 { font-size: 18px; letter-spacing: 2px; text-transform: uppercase;
       text-align: center; border-bottom: 3px dashed var(--ink); padding-bottom: 12px; }
  .card {
    background: var(--paper); border: 1px solid #ccc; border-radius: 6px;
    padding: 16px; margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; text-transform: uppercase;
          letter-spacing: 1px; margin-bottom: 6px; color: #555; }
  textarea { width: 100%; height: 120px; font: inherit; padding: 8px;
             border: 1px solid #bbb; border-radius: 4px; resize: vertical; }
  input[type=file] { font: inherit; width: 100%; }
  button {
    width: 100%; margin-top: 12px; padding: 12px; font: inherit;
    font-weight: bold; letter-spacing: 1px; text-transform: uppercase;
    background: var(--ink); color: var(--paper); border: 0; border-radius: 4px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: wait; }
  #status { text-align: center; font-size: 12px; min-height: 1.2em; margin-top: 12px; }
  #status.ok { color: #1a7a1a; }
  #status.err { color: #b00020; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button {
    margin: 0; padding: 6px 12px; width: auto; background: transparent;
    color: var(--ink); border: 1px solid #bbb; font-weight: normal;
  }
  .tabs button.active { background: var(--ink); color: var(--paper); }
  .panel { display: none; }
  .panel.active { display: block; }
  img.preview { max-width: 100%; max-height: 200px; display: block;
                margin: 8px auto 0; border: 1px dashed #bbb; padding: 4px; }
</style>
</head>
<body>
<h1>Little Printer</h1>

<div class="tabs">
  <button id="tab-text" class="active">Text</button>
  <button id="tab-image">Image</button>
  <button id="tab-personality">Personality</button>
</div>

<div class="card">
  <div id="panel-text" class="panel active">
    <label for="message">Message</label>
    <textarea id="message" placeholder="Hello, printer!"></textarea>
    <label style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);margin-top:8px;">
      <input type="checkbox" id="text-bubble" style="width:auto"> Speech balloon
    </label>
    <label style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);">
      <input type="checkbox" id="text-face" checked style="width:auto"> Include face
    </label>
    <button id="print-text">Print</button>
  </div>
  <div id="panel-image" class="panel">
    <label for="image">Image (PNG / JPEG)</label>
    <input type="file" id="image" accept="image/png,image/jpeg">
    <img id="preview" class="preview" alt="" hidden>
    <label style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);margin-top:8px;">
      <input type="checkbox" id="image-face" checked style="width:auto"> Include face
    </label>
    <button id="print-image" disabled>Print</button>
  </div>
  <div id="panel-personality" class="panel">
    <p style="font-size:13px;color:#555;margin:4px 0 12px;">
      The four personality images stored in the printer (384px wide
      recommended). Pushing replaces the BERG-era faces in the printer's
      flash, and they are re-pushed automatically whenever the printer
      reconnects.
    </p>
    <label for="p-face">Face</label>
    <input type="file" id="p-face" accept="image/png,image/jpeg">
    <label for="p-nothing" style="margin-top:10px;">"Nothing to print" face</label>
    <input type="file" id="p-nothing" accept="image/png,image/jpeg">
    <label for="p-nobridge" style="margin-top:10px;">"Cannot see bridge" face</label>
    <input type="file" id="p-nobridge" accept="image/png,image/jpeg">
    <label for="p-nointernet" style="margin-top:10px;">"Cannot see internet" face</label>
    <input type="file" id="p-nointernet" accept="image/png,image/jpeg">
    <button id="push-personality">Upload &amp; push</button>
    <button id="repush-personality" style="background:transparent;color:var(--ink);border:1px solid #bbb;">Re-push stored</button>
  </div>
</div>

<div id="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const status = (msg, cls) => {
  const el = $("status");
  el.textContent = msg;
  el.className = cls || "";
};

// Tabs
for (const id of ["text", "image", "personality"]) {
  $("tab-" + id).onclick = () => {
    for (const t of ["text", "image", "personality"]) {
      $("tab-" + t).classList.toggle("active", t === id);
      $("panel-" + t).classList.toggle("active", t === id);
    }
  };
}

// Image preview
let file = null;
$("image").onchange = () => {
  file = $("image").files[0] || null;
  $("print-image").disabled = !file;
  $("preview").hidden = !file;
  if (file) $("preview").src = URL.createObjectURL(file);
};

async function print(body, type, busyBtn, params = "") {
  busyBtn.disabled = true;
  status("Sending…");
  try {
    const res = await fetch("/print" + params, { method: "POST", headers: { "Content-Type": type }, body });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    status(data.status === "queued" ? "Queued — printer is offline, will print on reconnect." : "Sent to printer!", "ok");
  } catch (err) {
    status("Failed: " + err.message, "err");
  } finally {
    busyBtn.disabled = false;
  }
}

$("print-text").onclick = () => {
  const text = $("message").value.trim();
  if (!text) { status("Type a message first.", "err"); return; }
  let params = "?";
  if ($("text-bubble").checked) params += "bubble=1&";
  if (!$("text-face").checked) params += "face=no";
  print(text, "text/plain", $("print-text"), params);
};

$("print-image").onclick = () => {
  if (!file) return;
  const params = $("image-face").checked ? "" : "?face=no";
  print(file, file.type, $("print-image"), params);
};

// Personality
$("push-personality").onclick = async () => {
  const btn = $("push-personality");
  const fd = new FormData();
  const slots = { "p-face": "face", "p-nothing": "nothing_to_print", "p-nobridge": "cannot_see_bridge", "p-nointernet": "cannot_see_internet" };
  for (const [el, slot] of Object.entries(slots)) {
    const f = $(el).files[0];
    if (!f) { status("Missing image: " + slot, "err"); return; }
    fd.append(slot, f);
  }
  btn.disabled = true;
  status("Pushing personality…");
  try {
    const res = await fetch("/personality", { method: "POST", body: fd });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    status("Personality pushed — the printer now uses it for every print.", "ok");
  } catch (err) {
    status("Failed: " + err.message, "err");
  } finally {
    btn.disabled = false;
  }
};

$("repush-personality").onclick = async () => {
  const btn = $("repush-personality");
  btn.disabled = true;
  status("Re-pushing stored personality…");
  try {
    const res = await fetch("/personality/push", { method: "POST" });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    status("Re-pushed.", "ok");
  } catch (err) {
    status("Failed: " + err.message, "err");
  } finally {
    btn.disabled = false;
  }
};

// Connection status
(async function poll() {
  try {
    const res = await fetch("/status");
    const st = await res.json();
    const dot = st.device_connected ? "🟢 printer connected" : (st.queued_print ? "🟡 printer offline — print queued" : "🔴 printer offline");
    document.title = dot.replace(/^\S+ /, "") + " — Little Printer";
  } catch { /* ignore */ }
  setTimeout(poll, 10000);
})();
</script>
</body>
</html>
